services:
  # Express Backend API + Worker Service
  - type: web
    name: reachinbox-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npm run build && npx prisma db push
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: reachinbox-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: reachinbox-redis
          property: connectionString
      - key: FRONTEND_URL
        sync: false
      - key: WORKER_CONCURRENCY
        value: "5"
      - key: RATE_LIMITER_MAX
        value: "10"
      - key: MIN_DELAY_BETWEEN_SENDS_MS
        value: "1000"
      - key: MAX_EMAILS_PER_HOUR_PER_SENDER
        value: "100"
      - key: MAX_EMAILS_PER_HOUR_GLOBAL
        value: "500"

databases:
  # Managed PostgreSQL Database
  - name: reachinbox-db
    databaseName: reachinbox
    user: postgres

  # Managed Redis Cache/Queue Instance
  - type: redis
    name: reachinbox-redis
    ipAllowList: []
